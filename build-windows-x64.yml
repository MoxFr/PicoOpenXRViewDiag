name: Build Windows x64

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure x64 Release
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Assemble package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build/Release/PicoOpenXRViewDiag.dll package/
          Copy-Item XR_APILAYER_MOX_pico_view_diag.json package/
          Copy-Item Enable-PicoDiag.bat package/
          Copy-Item Disable-PicoDiag.bat package/
          Copy-Item Show-Log.bat package/
          Copy-Item README.md package/

      - name: Upload Windows x64 package
        uses: actions/upload-artifact@v4
        with:
          name: PicoOpenXRViewDiag-Windows-x64
          path: package/
          if-no-files-found: error
